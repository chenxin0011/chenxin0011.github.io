<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chancy · 作品与活动</title>
<meta name="description" content="Chancy 的个人网站：作品、研究与活动记录。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F2; --ink:#16202A; --muted:#5B6773; --line:#D2D8DB; --accent:#1F4FD8; --chip:#E3E8EA;
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171E; --ink:#E8ECEF; --muted:#9AA7B2; --line:#27323C; --accent:#7C9BFF; --chip:#1B252E}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
nav{display:flex;gap:22px;padding:22px 0;font-size:15px}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
header.hero{padding:56px 0 48px}
h1{font:700 clamp(40px,9vw,68px)/1.1 var(--serif);margin:0 0 18px;letter-spacing:-.01em}
.lead{font:500 clamp(19px,3.4vw,24px)/1.6 var(--serif);max-width:30em;margin:0 0 14px}
.sub{color:var(--muted);margin:0;max-width:34em}
section{padding:44px 0;border-top:1px solid var(--line)}
h2{font:700 26px/1.3 var(--serif);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{font:inherit;font-size:14px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.work{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
.work h3{font:700 19px/1.4 var(--serif);margin:0}
.work h3 a{text-decoration:none;border-bottom:1px solid var(--accent)}
.work h3 a:hover{color:var(--accent)}
.work time{color:var(--muted);font-size:14px;white-space:nowrap;padding-top:3px}
.work p{grid-column:1/-1;margin:4px 0 0;color:var(--muted)}
.tag{display:inline-block;margin-top:8px;font-size:13px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 28px}
.timeline li::before{content:"";position:absolute;left:-29px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline time{display:block;color:var(--muted);font-size:14px}
.timeline b{font:700 18px/1.5 var(--serif)}
.timeline p{margin:2px 0 0;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px 26px;margin:0;padding:0;list-style:none}
.links a{border-bottom:1px solid var(--accent);text-decoration:none}
footer{padding:30px 0 60px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <nav aria-label="页面导航">
    <a href="#works">作品</a><a href="#activities">活动</a><a href="#contact">联系</a>
  </nav>

  <header class="hero">
    <h1 id="name"></h1>
    <p class="lead" id="tagline"></p>
    <p class="sub" id="intro"></p>
  </header>

  <section id="works">
    <h2>作品</h2>
    <div class="chips" id="filters" role="group" aria-label="按类别筛选"></div>
    <div id="workList"></div>
  </section>

  <section id="activities">
    <h2>活动</h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section id="contact">
    <h2>联系</h2>
    <ul class="links" id="links"></ul>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* ====== 只需修改这里的内容 ====== */
const SITE = {
  name: "Chancy",
  tagline: "伦敦国王学院 PEEM 硕士在读，关注政策、产业与企业决策。",
  intro: "本科毕业于上海财经大学投资学专业，有市场策划工作经历。这里记录我的研究、项目与活动。",
  works: [
    { title: "政府补贴与中国汽车上市公司对外直接投资（硕士论文）", year: "2026", cat: "研究", desc: "研究政府补贴如何影响汽车企业的海外投资决策。", url: "" },
    { title: "示例项目：市场策划案例", year: "2025", cat: "项目", desc: "用一两句话说明你做了什么、结果如何。", url: "https://github.com/" },
    { title: "示例文章：课程分析报告", year: "2025", cat: "写作", desc: "替换成你的真实作品，链接可留空。", url: "" }
  ],
  activities: [
    { date: "2025.09 – 至今", title: "King’s College London · PEEM 硕士", desc: "政治、经济与管理方向。" },
    { date: "示例日期", title: "活动或比赛名称", desc: "写下你的角色和收获。" }
  ],
  links: [
    { label: "GitHub", url: "https://github.com/你的用户名" },
    { label: "邮箱", url: "mailto:你的邮箱@example.com" },
    { label: "LinkedIn", url: "https://www.linkedin.com/in/你的主页" }
  ]
};
/* ====== 以下无需改动 ====== */
const $ = id => document.getElementById(id);
$("name").textContent = SITE.name;
$("tagline").textContent = SITE.tagline;
$("intro").textContent = SITE.intro;
document.title = SITE.name + " · 作品与活动";

const cats = ["全部", ...new Set(SITE.works.map(w => w.cat))];
let current = "全部";
function el(tag, props = {}, kids = []) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach(k => e.append(k));
  return e;
}
function renderWorks() {
  const box = $("workList"); box.replaceChildren();
  SITE.works.filter(w => current === "全部" || w.cat === current).forEach(w => {
    const h = el("h3", {}, [w.url ? el("a", { href: w.url, target: "_blank", rel: "noopener", textContent: w.title }) : w.title]);
    box.append(el("article", { className: "work" }, [
      h, el("time", { textContent: w.year }),
      el("p", { textContent: w.desc }),
      el("span", { className: "tag", textContent: w.cat })
    ]));
  });
}
function renderFilters() {
  const box = $("filters"); box.replaceChildren();
  cats.forEach(c => {
    const b = el("button", { type: "button", textContent: c });
    b.setAttribute("aria-pressed", String(c === current));
    b.onclick = () => { current = c; renderFilters(); renderWorks(); };
    box.append(b);
  });
}
renderFilters(); renderWorks();

SITE.activities.forEach(a => $("timeline").append(el("li", {}, [
  el("time", { textContent: a.date }), el("b", { textContent: a.title }), el("p", { textContent: a.desc })
])));
SITE.links.forEach(l => $("links").append(el("li", {}, [el("a", { href: l.url, textContent: l.label })])));
$("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
</script>
</body>
</html>
